name: Release Portable Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to (for manual rerun)
        required: true
        type: string

permissions:
  contents: write

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-upload-windows:
    name: Build Windows installer and portable zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve target tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TARGET_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: rust-stable-windows-x64-release-portable
          workspaces: |
            . -> target

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build installer
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm build

      - name: Build portable zip
        run: pnpm portable

      - name: Validate generated artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer not found under target/release/bundle/nsis/"
          }
          $portable = Get-ChildItem "Clash.Verge_*_portable.zip" | Select-Object -First 1
          if (-not $portable) {
            throw "Portable zip not found in repository root."
          }

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TARGET_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            target/release/bundle/nsis/*-setup.exe
            Clash.Verge_*_portable.zip
